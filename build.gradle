plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "ServerPresence"
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// other mods to check the compatibility with (not committed), e.g. Server Groups
	modLocalRuntime fileTree(dir: "run-mods", include: "*.jar")
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "serverpresence-test"
		enableGameTests = false
		enableClientGameTests = true
		clearRunDirectory = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// the multiplayer screen of the test pings servers, which the network synchronizer of the 1.21.11 test API rejects
loom {
	runs {
		configureEach {
			if (name == "clientGameTest") {
				vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
			}
		}
	}
}
